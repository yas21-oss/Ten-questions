name: Version, Validate & Tag

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  version-and-tag:
    name: Detect Version & Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: read_version
        run: |
          echo "=== Reading Version ==="
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties not found in repository root."
            exit 1
          fi

          VERSION_NAME=$(grep -E '^[[:space:]]*appVersionName[[:space:]]*=' gradle.properties | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')
          VERSION_CODE=$(grep -E '^[[:space:]]*appVersionCode[[:space:]]*=' gradle.properties | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::appVersionName property missing in gradle.properties."
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "::error::appVersionCode property missing in gradle.properties."
            exit 1
          fi

          echo "Detected appVersionName: $VERSION_NAME"
          echo "Detected appVersionCode: $VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate Semantic Version format
        run: |
          VERSION_NAME="${{ steps.read_version.outputs.version_name }}"
          echo "Validating semantic version format for: '$VERSION_NAME'"

          # Enforce strict Semantic Versioning: MAJOR.MINOR.PATCH (e.g., 1.0.0, 1.2.0, 2.10.5)
          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "$VERSION_NAME" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid versionName: '$VERSION_NAME'."
            echo "::error::Version must strictly follow Semantic Versioning (MAJOR.MINOR.PATCH), e.g., '1.0.0', '1.2.0', '2.10.5'."
            exit 1
          fi

          echo "Semantic version validation PASSED: $VERSION_NAME"

      - name: Validate versionCode is positive integer
        run: |
          VERSION_CODE="${{ steps.read_version.outputs.version_code }}"
          echo "Validating versionCode: '$VERSION_CODE'"

          POSITIVE_INT_REGEX='^[1-9][0-9]*$'

          if [[ ! "$VERSION_CODE" =~ $POSITIVE_INT_REGEX ]]; then
            echo "::error::Invalid versionCode: '$VERSION_CODE'."
            echo "::error::versionCode must be a positive integer greater than 0."
            exit 1
          fi

          echo "versionCode positive integer validation PASSED: $VERSION_CODE"

      - name: Check if tag already exists (Duplicate Protection)
        id: tag_check
        run: |
          TAG_NAME="${{ steps.read_version.outputs.tag_name }}"
          echo "Checking if tag '$TAG_NAME' already exists..."

          git fetch --tags --force

          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists."
            echo "No new version detected. Gracefully stopping workflow without creating duplicate release."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG_NAME' does not exist yet. Proceeding with release checks."
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate versionCode is strictly greater than previous releases
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          CURRENT_CODE="${{ steps.read_version.outputs.version_code }}"
          echo "Current versionCode: $CURRENT_CODE"

          # Find previous release tags matching v*.*.*
          PREV_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1 || true)

          if [ -n "$PREV_TAG" ]; then
            echo "Most recent release tag found: $PREV_TAG"

            # Attempt to read previous versionCode from that tag's gradle.properties
            PREV_CODE=$(git show "$PREV_TAG:gradle.properties" 2>/dev/null | grep -E '^[[:space:]]*appVersionCode[[:space:]]*=' | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"' || true)

            # Fallback to app/build.gradle.kts if previously defined there
            if [ -z "$PREV_CODE" ]; then
              PREV_CODE=$(git show "$PREV_TAG:app/build.gradle.kts" 2>/dev/null | grep -E '^[[:space:]]*versionCode[[:space:]]*=' | head -n1 | grep -o '[0-9]\+' || true)
            fi

            if [ -n "$PREV_CODE" ]; then
              echo "Previous release versionCode: $PREV_CODE"
              if [ "$CURRENT_CODE" -le "$PREV_CODE" ]; then
                echo "::error::Current versionCode ($CURRENT_CODE) must be strictly greater than previous released versionCode ($PREV_CODE)."
                exit 1
              fi
              echo "versionCode progression check PASSED: $CURRENT_CODE > $PREV_CODE"
            else
              echo "Could not parse versionCode from previous tag $PREV_TAG. Skipping comparison."
            fi
          else
            echo "No prior release tags detected in repository. This will be the first release."
          fi

      - name: Create and push Git release tag
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          TAG_NAME="${{ steps.read_version.outputs.tag_name }}"
          VERSION_NAME="${{ steps.read_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.read_version.outputs.version_code }}"

          echo "Configuring git credentials..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Creating annotated tag: $TAG_NAME"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME (versionCode: $VERSION_CODE)"

          echo "Pushing tag '$TAG_NAME' to origin..."
          git push origin "$TAG_NAME"

          echo "Tag $TAG_NAME pushed successfully! Release workflow will now trigger automatically."

name: Build & Publish Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Tag and Version
        id: release_info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG_NAME (version: $VERSION_NAME)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permissions for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests ==="
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Setup Keystore & Signing Credentials
        id: setup_signing
        run: |
          echo "=== Configuring Keystore ==="
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Generating release keystore with alias 'upload'..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Ten Questions,O=AI Studio,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Ten Questions,O=AI Studio,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: |
          echo "=== Building Release APK ==="
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Package Release Assets & Compute Checksum
        id: package_assets
        run: |
          TAG_NAME="${{ steps.release_info.outputs.tag_name }}"
          echo "Locating built APK..."

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          RELEASE_APK="TenQuestions-${TAG_NAME}.apk"
          CHECKSUM_FILE="TenQuestions-${TAG_NAME}.apk.sha256"

          cp "$APK_PATH" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$CHECKSUM_FILE"

          echo "Release APK created: $RELEASE_APK"
          cat "$CHECKSUM_FILE"

          echo "apk_file=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$CHECKSUM_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Release Notes
        id: generate_notes
        run: |
          TAG_NAME="${{ steps.release_info.outputs.tag_name }}"
          VERSION_NAME="${{ steps.release_info.outputs.version_name }}"
          VERSION_CODE=$(grep -E '^[[:space:]]*appVersionCode[[:space:]]*=' gradle.properties | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')
          APK_FILE="${{ steps.package_assets.outputs.apk_file }}"
          SHA256_HASH=$(cat "${{ steps.package_assets.outputs.checksum_file }}" | awk '{print $1}')

          # Find previous tag if any
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)

          echo "Generating release notes comparing $PREV_TAG..$TAG_NAME..."

          cat << 'EOF' > release_notes.md
          ## 📱 Ten Questions Release __TAG_NAME__

          ### 📦 Version Information
          - **Version:** `__VERSION_NAME__`
          - **Build Code:** `__VERSION_CODE__`
          - **Artifact:** `__APK_FILE__`
          - **SHA-256 Checksum:** `__SHA256__`

          ### 🚀 Changes in this Release
          EOF

          # Replace template variables
          sed -i "s/__TAG_NAME__/${TAG_NAME}/g" release_notes.md
          sed -i "s/__VERSION_NAME__/${VERSION_NAME}/g" release_notes.md
          sed -i "s/__VERSION_CODE__/${VERSION_CODE}/g" release_notes.md
          sed -i "s/__APK_FILE__/${APK_FILE}/g" release_notes.md
          sed -i "s/__SHA256__/${SHA256_HASH}/g" release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_notes.md
            echo "Commits since **${PREV_TAG}**:" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          else
            echo "" >> release_notes.md
            echo "Initial release commits:" >> release_notes.md
            git log -n 25 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*Automated release built and published via GitHub Actions.*" >> release_notes.md

          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.release_info.outputs.tag_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.package_assets.outputs.apk_file }}
            ${{ steps.package_assets.outputs.checksum_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
